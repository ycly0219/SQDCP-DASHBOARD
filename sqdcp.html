<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>SQDCP 看板</title>
  <style>
*{box-sizing:border-box;margin:0;padding:0}
/* ===== 重置与全局变量 ===== :root 内 --accent/--accent-2 为强调色，--good/--bad/--warn/--neutral 为状态色，--card/--glass-border 为毛玻璃面板，--radius/--shadow/--ease 为通用圆角阴影缓动 */
:root{--accent:#0ea5e9;--accent-light:#38bdf8;--accent-2:#6366f1;--good:#10b981;--bad:#f43f5e;--warn:#f59e0b;--neutral:#64748b;--td:#1e293b;--tm:#475569;--tl:#94a3b8;--card:rgba(255,255,255,.72);--card-solid:rgba(255,255,255,.92);--glass-border:rgba(14,165,233,.22);--glass-border-hi:rgba(14,165,233,.5);--radius:16px;--shadow:0 10px 30px rgba(30,58,110,.10);--ease:cubic-bezier(.22,.61,.36,1)}
@keyframes fadeUp{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes pulseGlow{0%,100%{box-shadow:0 4px 14px rgba(91,110,245,.4)}50%{box-shadow:0 6px 26px rgba(91,110,245,.72)}}
@keyframes glimmer{0%,100%{opacity:.3}50%{opacity:.7}}
/* 常驻动效：仅使用 opacity / transform，配合 will-change 实现 GPU 加速、无重排 */
@keyframes warnLine{0%,100%{opacity:.22}50%{opacity:1}}                         /* 未达标行警示线 2.5s */
@keyframes radarSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}} /* 雷达扫描光环 14s */
html,body{height:100vh;overflow-y:auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif}
body{display:flex;flex-direction:column;padding:14px;gap:12px;position:relative;background:radial-gradient(1100px 620px at 10% -15%,rgba(56,189,248,.14),transparent 60%),radial-gradient(900px 520px at 95% 8%,rgba(129,140,248,.10),transparent 55%),radial-gradient(1000px 620px at 110% 115%,rgba(236,72,153,.08),transparent 55%),linear-gradient(135deg,#eef5fd 0%,#f4f8fe 48%,#eaf1fb 100%);color:var(--td);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;animation:glimmer 8s ease-in-out infinite}
body>*{position:relative;z-index:1}
/* ===== 顶部导航栏 .hdr ===== 标题、logo、月份下拉、达标率胶囊；毛玻璃 + 底部高光分隔线 */
.hdr{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);border:1px solid var(--glass-border);padding:11px 24px;border-radius:var(--radius);flex:0 0 auto;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7);animation:fadeUp .55s var(--ease) both;position:relative}
.hdr::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(56,189,248,.6),transparent)}
.hdr h1{font-size:18px;font-weight:700;background:linear-gradient(90deg,#0284c7,#4f46e5 60%,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px rgba(56,189,248,.3))}
.hdr .ctrl{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--tm);flex:0 0 auto}
.hdr-logo{display:flex;align-items:center;flex:0 1 auto;margin-left:14px;margin-right:auto;overflow:hidden}
.hdr-logo img{display:block;max-width:100%;max-height:50px;object-fit:contain}
.logo-partner{display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 6px;position:relative}
.partner-amp{position:relative;z-index:1;font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;font-style:italic;line-height:1;background:linear-gradient(135deg,#38bdf8,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 0 5px rgba(125,211,252,.5));user-select:none}
@keyframes borderSpin{to{transform:rotate(360deg)}}
.hdr select{padding:5px 12px;border:1px solid rgba(56,189,248,.25);border-radius:8px;background:rgba(255,255,255,.7);color:var(--td);font-size:13px}
.hdr select option{color:var(--td);background:#fff}
.hdr .rate{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(129,140,248,.25));color:#0369a1;padding:6px 16px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid rgba(56,189,248,.35);box-shadow:0 4px 14px rgba(56,189,248,.2),0 0 30px rgba(56,189,248,.08);white-space:nowrap;animation:pulseGlow 3.4s ease-in-out infinite}
/* ===== KPI 卡片组 .kpis/.kpi ===== 当前由 .kpis{display:none} 整组隐藏，renderKPIs 仍会生成 DOM 并算值，便于日后恢复展示 */
.kpis{display:none}
.kpi{background:var(--card);backdrop-filter:blur(18px);color:var(--td);padding:12px 16px 10px;border-radius:var(--radius);border:1px solid var(--glass-border);box-shadow:var(--shadow),inset 0 1px 0 rgba(56,189,248,.1);text-align:left;position:relative;overflow:hidden;animation:fadeUp .5s var(--ease) both}
.kpi:nth-child(1){animation-delay:.06s}.kpi:nth-child(2){animation-delay:.12s}.kpi:nth-child(3){animation-delay:.18s}.kpi:nth-child(4){animation-delay:.24s}.kpi:nth-child(5){animation-delay:.28s}.kpi:nth-child(6){animation-delay:.32s}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--good))}
.kpi::after{content:"";position:absolute;top:-50px;right:-50px;width:110px;height:110px;background:radial-gradient(circle,rgba(56,189,248,.14),transparent 70%);border-radius:50%;pointer-events:none}
.kpi .v{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#0284c7,#0ea5e9 60%,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;filter:drop-shadow(0 2px 8px rgba(56,189,248,.35))}
.kpi .l{font-size:11px;color:var(--tm);margin-top:1px;font-weight:500;letter-spacing:.3px}
/* ===== 中部五维类别区 .cats/.cat ===== 每个类别一张卡片，含字母形状日历与达标率 */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex:0 1 auto;min-height:0}
.cat{background:var(--card);backdrop-filter:blur(18px);color:var(--td);border-radius:var(--radius);overflow:hidden;border:1px solid var(--glass-border);box-shadow:var(--shadow),inset 0 1px 0 rgba(56,189,248,.08);display:flex;flex-direction:column;min-height:0;position:relative}
.cat+.cat{border-left:1px solid rgba(56,189,248,.08)}
.cat-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;color:#fff;font-weight:700;flex:0 0 auto;position:relative}
.cat-hdr .lt{font-size:20px;font-style:italic;font-weight:900;opacity:.95;width:20px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.cat-hdr .nm{font-size:13px;flex:1;letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.cat-hdr .pct{font-size:11px;background:rgba(255,255,255,.28);padding:2px 10px;border-radius:12px;font-weight:600;backdrop-filter:blur(2px)}
.cal{padding:10px 12px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;align-items:center;justify-content:center;max-height:100%;background:color-mix(in srgb,var(--catc) 5%,transparent)}
/* 字母形状日历：CSS Grid 精确布局，空位零尺寸 */
.letter-grid{--cell:24px;display:inline-grid;gap:2px;align-self:center;justify-self:center;max-width:100%;max-height:100%;margin-bottom:6px;overflow:hidden}
.cal-cell{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-radius:3px;background:rgba(100,116,139,.15);color:#475569;border:1px solid color-mix(in srgb,var(--catc) 22%,rgba(100,116,139,.25));position:relative;width:var(--cell);height:var(--cell);flex:0 0 var(--cell);box-sizing:border-box;line-height:1;padding:0}
/* 空位完全折叠，不占任何空间 */
.cal-cell.empty{width:var(--cell);height:var(--cell);padding:0;margin:0;border:none;background:transparent;flex:0 0 var(--cell);visibility:hidden;pointer-events:none}
.cal-cell.g{background:rgba(52,211,153,.22);color:var(--td);border-color:rgba(52,211,153,.6)}
.cal-cell.r{background:rgba(244,63,94,.18);color:#e11d48;border-color:rgba(244,63,94,.65)}
.cal-cell.n{background:rgba(148,163,184,.12);color:var(--tl);border-color:rgba(148,163,184,.2)}
/* 已弃用占位格子：改为按当月天数把字母自适应缩放到恰好 dim 个格子，不再使用空白/虚线占位 */
.ci{display:block;background:color-mix(in srgb,var(--catc) 5%,transparent)}
.ci .row{display:flex;justify-content:center;align-items:flex-end;gap:8px;padding:0 13px;position:relative}
.ci .row .st-ph{flex:1}
.ci .row .st{color:var(--tm);font-size:11px;white-space:nowrap;transform-origin:right center}
.ci .owner{color:var(--tm);font-size:13px;font-weight:700;background:color-mix(in srgb,var(--catc) 5%,transparent);border:none;padding:1px 8px;border-radius:999px;white-space:nowrap}
.ci .owner .lb{color:var(--tl);margin-right:3px}

/* ===== 底部三栏 .row2/.panel ===== 指标对比表 / 未达标清单 / 五维达标率雷达图 */
.row2{display:grid;grid-template-columns:1.4fr 1.35fr .8fr;gap:10px;flex:1;min-height:0}
.panel{background:var(--card);backdrop-filter:blur(18px);color:var(--td);padding:13px 16px;border-radius:var(--radius);border:1px solid var(--glass-border);box-shadow:var(--shadow),inset 0 1px 0 rgba(56,189,248,.08);display:flex;flex-direction:column;min-height:0;animation:fadeUp .6s var(--ease) both;position:relative}
.panel:nth-child(1){animation-delay:.30s}.panel:nth-child(2){animation-delay:.36s}.panel:nth-child(3){animation-delay:.42s}
.panel h3{font-size:18px;font-weight:900;color:#0f2547;margin-bottom:10px;flex:0 0 auto;padding-bottom:7px;border-bottom:1px solid rgba(56,189,248,.2);display:flex;align-items:center;gap:7px;letter-spacing:1px}
.panel h3::before{content:"";display:inline-block;width:4px;height:19px;background:linear-gradient(180deg,#38bdf8,#818cf8);border-radius:3px;box-shadow:0 0 10px rgba(56,189,248,.85)}
.panel-body{flex:1;overflow:hidden;display:flex;gap:10px;min-height:0}
.cmp-col,.fail-col{flex:1;overflow-y:auto;font-size:13px;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.2) transparent}
.cmp-col::-webkit-scrollbar,.fail-col::-webkit-scrollbar{width:4px}
.cmp-col::-webkit-scrollbar-thumb,.fail-col::-webkit-scrollbar-thumb{background:rgba(148,163,184,.2);border-radius:2px}
.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tb th,.tb td{padding:10px 12px;border-bottom:1px solid rgba(56,189,248,.08);text-align:left;font-size:13px;color:var(--tm);font-weight:400}
.tb thead th{position:sticky;top:0;background:rgba(240,247,255,.96);color:#0369a1;font-weight:700;font-size:11px;z-index:2;box-shadow:0 1px 0 rgba(56,189,248,.15);letter-spacing:.5px}
.tb tbody tr:nth-child(even) td{background:rgba(56,189,248,.04)}
.tb td:nth-child(3){font-variant-numeric:tabular-nums;font-weight:700;color:var(--td)}
.tb td:nth-child(4){font-variant-numeric:tabular-nums;color:var(--tl)}
.tb .g{color:var(--good);font-weight:700}
.tb .r{color:var(--bad);font-weight:700}
.tb .trend{font-size:11px;margin-left:3px;font-weight:700}.tb .trend.up{color:var(--good)}.tb .trend.down{color:var(--bad)}


.chart-col{display:flex;flex-direction:column;flex:1;gap:6px;min-height:240px;position:relative;padding:10px 14px;border-radius:14px;background:transparent;border:none;box-shadow:none}
.chart-col canvas{width:100%;flex:1;min-height:0;border-radius:10px;position:relative;z-index:1}
/* 雷达图底层：同心圆 + 扇形扫描光环，transform 自转（14s），置于画布之下 */
.chart-col::before{content:"";position:absolute;top:50%;left:50%;width:min(72%,220px);height:min(72%,220px);transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(56,189,248,.14);background:conic-gradient(from 0deg,rgba(56,189,248,.22),transparent 55deg),repeating-radial-gradient(circle,rgba(56,189,248,.1) 0 1px,transparent 1px 20px);opacity:.5;z-index:0;pointer-events:none;animation:radarSpin 14s linear infinite;will-change:transform}
.chart-legend{display:none}
/* 图例 .chart-legend 当前由 display:none 隐藏，HTML 仍由 renderPieAndFail 生成以便日后复用 */
.chart-legend .lg-row{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 11px;border-radius:11px;background:rgba(14,165,233,.06);font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 14px -4px rgba(0,0,0,.45)}
.chart-legend .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
.chart-legend .lg-pct{font-weight:800;color:var(--accent);margin-left:2px;font-variant-numeric:tabular-nums;font-size:16px;text-shadow:0 0 12px rgba(56,189,248,.5)}
.chart-legend .lg-row>span:not(.lg-pct):not(.dot){color:#1e293b!important;font-weight:600}
#dataStatus{font-size:11px;color:var(--tm);margin-right:6px;letter-spacing:.3px}.fail-col .empty{color:var(--good);text-align:center;padding:24px 12px;font-weight:600;font-size:13px}
.fail-item{padding:6px 0;border-bottom:1px solid rgba(56,189,248,.08);animation:fadeUp .4s var(--ease) both;position:relative}
.fail-item::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:linear-gradient(180deg,var(--bad),rgba(251,113,133,.25));opacity:.22;animation:warnLine 2.5s ease-in-out infinite;will-change:opacity}
.fail-item:last-child{border-bottom:none}
.fail-item .fi-h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tm);margin-bottom:3px}
.fail-item .fi-h .date{background:rgba(251,191,36,.15);color:var(--warn);padding:1px 8px;border-radius:6px;font-weight:700}
.fail-item .fi-b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fail-item .fi-b .nm{font-weight:500;color:var(--td)}
.fail-item .fi-b .vals{font-size:13px;color:var(--tm);font-variant-numeric:tabular-nums}
.fail-item .fi-b .vals .act{color:var(--bad);font-weight:700}
.fail-item .fi-b .vals .tgt{color:var(--tl)}
.dash-empty{display:flex;align-items:center;justify-content:center;min-height:90px;color:var(--tm);font-size:13px;font-weight:600}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(3,1fr)}.row2{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.cats{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}}
@media(max-width:520px){.cats{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
</style>
</head>

    // ===== 类别配置 =====
    // 每个类别的展示信息 + 红绿灯判定规则：
    //  anyNonZero : 只要该类别下任一指标当日 >0 即判红(r)，否则绿(g)
    //  bothTarget : 交付类，D01出库准时率 与 D03入库准时率 都达标才绿，否则红
    //  allTarget  : 成本/人员类，所有带目标的指标当日都达标才绿，否则红
    const CATS = [
      { cat: "Safety", letter: "S", cn: "安全", color: "#5b6ef5", rule: "anyNonZero", owner: "张志伟" },
      { cat: "Quality", letter: "Q", cn: "质量", color: "#22c55e", rule: "anyNonZero", owner: "张志伟" },
      { cat: "Delivery", letter: "D", cn: "交付", color: "#06b6d4", rule: "bothTarget", owner: "张志伟" },
      { cat: "Cost", letter: "C", cn: "成本", color: "#f59e0b", rule: "allTarget", owner: "张志伟" },
      { cat: "People", letter: "P", cn: "人员", color: "#ec4899", rule: "allTarget", owner: "张志伟" }
    ];
    // 根据指标目标方向(越低越好/越高越好/不低于阈值)与实测值 v，返回红绿灯状态
    //   "g" 绿(达标) / "r" 红(未达标) / "n" 灰(无目标)
    function statusOf(m, v) {
      if (v === null || v === undefined || m.target === null || m.target === undefined) return "n";
      var t = m.target, d = m.targetDir;
      if (d === "越低越好") return v <= t ? "g" : "r";
      if (d === "越高越好" || d === "不低于阈值") return v >= t ? "g" : "r";
      return "n";
    }
    // 按单位格式化数值：百分比×100、计数取整、工时/金额保留1位，其余保留2位
    function fmt(v, u) {
      if (v === null || v === undefined) return "—";
      var n = typeof v === "number" ? v : parseFloat(v);
      if (isNaN(n)) return v;
      if (u === "%") return (n * 100).toFixed(1) + "%";
      if (["次", "人", "件", "LPN"].indexOf(u) >= 0) return Math.round(n);
      if (["小时", "元", "小时/元"].indexOf(u) >= 0) return n.toFixed(1);
      return n.toFixed(2);
    }
    // 返回某指标在计算"月度均值/达标"时优先采用的主维度
    // 例如加班看"加班工时"、出库看"准时出库量"、出勤看"实际出勤"
    function mainDim(c) {
      if (c === "C01" || c === "C02") return "加班工时";
      if (c === "D02") return "准时出库量";
      if (c === "D04") return "准时入库量";
      if (c === "P02") return "实际出勤";
      return "实际值";
    }
    // 数字补零为两位字符串（如 1 -> "01"），用于拼接年月日
    function pad2(n) { return n < 10 ? "0" + n : String(n); }
    // 把 "2026-02-08" 形式日期转成 "2月8日" 的中文展示
    function fmtDate(d) { var p = d.split("-"); return p[1] + "月" + parseInt(p[2], 10) + "日"; }

    // 取当前选中月份（来自右上角下拉框），这是所有渲染函数的数据基准
    function curMonth() { return document.getElementById("monthSel").value; }
    // 判断某月份在原始数据中是否存在任何有效日记录
    function monthHasData(ym) {

    // 总渲染入口：月份切换(onchange)时调用，依次刷新各面板
    function renderAll() {
      var ym = curMonth();
      // 空数据校验：选中月份取不到有效数据则不渲染任何内容
      if (!ym || !monthHasData(ym)) { showEmptyState(); return; }
      renderKPIs(); renderCats(); renderCompare(); renderPieAndFail(); renderOverallRate(); initAutoScroll();
    }
    // 自动循环滚动：对指定容器初始化跑马灯效果（内容超出时出现滚动条并自动滚动，到底循环回顶部）
    function initAutoScroll() {
      var c1 = document.querySelector(".cmp-col");
      var c2 = document.querySelector(".fail-col");
      autoScrollFor(c1);
      autoScrollFor(c2);
    }
    // 为单个容器设置自动滚动；悬停事件只绑定一次，避免重复渲染时叠加
    function autoScrollFor(el) {
      if (!el) return;
      startScroll(el);
    }
    function startScroll(el) {
      stopScroll(el);
      // 内容可完全显示（无溢出）则不滚动
      if (el.scrollHeight - el.clientHeight <= 10) return;
      el.scrollTop = 0;
      // 以 requestAnimationFrame 做亚像素平滑累加，约 5px/秒，缓慢且顺滑；到底循环回顶部
      el._acc = 0;
      var last = performance.now();
      var SPEED = 5; // 像素/秒（比原 12px/秒更慢更稳）
      el._raf = requestAnimationFrame(function tick(now) {
        var dt = (now - last) / 1000; last = now;
        el._acc += SPEED * dt;
        while (el._acc >= 1) {
          if (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) el.scrollTop = 0;
          else el.scrollTop += 1;
          el._acc -= 1;
        }
        el._raf = requestAnimationFrame(tick);
      });
    }
    function stopScroll(el) { if (el._raf) { cancelAnimationFrame(el._raf); el._raf = null; } }
    // 计算某类别在指定日期的整体红绿灯状态，依据该类别的 rule 逐条判定
    function catDayStatus(cat, dateStr) {
      var dayRecs = DATA.daily.filter(function (r) { return r.date === dateStr; });
      var ms = DATA.metrics.filter(function (m) { return m.category === cat; });
      if (ms.length === 0) return "n";
      var rule = CATS.find(function (c) { return c.cat === cat; }).rule;
      // anyNonZero 规则：类别内任一指标当天数值>0 即判红，全部为0才绿
      if (rule === "anyNonZero") {
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i];
          for (var j = 0; j < dayRecs.length; j++) {
            var r = dayRecs[j];
            if (r.code === m.code && r.value !== null && r.value > 0) return "r";
          }
        }
        return "g";
      }
      // bothTarget 规则（交付）：D01出库准时率 与 D03入库准时率 都达标才绿
      if (rule === "bothTarget") {
        var d01 = ms.find(function (m) { return m.code === "D01"; });
        var d03 = ms.find(function (m) { return m.code === "D03"; });
        var r1 = dayRecs.find(function (r) { return r.code === "D01" && r.dim === "实际值"; });
        var r3 = dayRecs.find(function (r) { return r.code === "D03" && r.dim === "实际值"; });
        if (!r1 && !r3) return "n";
        var ok1 = d01 && r1 && statusOf(d01, r1.value) === "g";
        var ok3 = d03 && r3 && statusOf(d03, r3.value) === "g";
        return (ok1 && ok3) ? "g" : "r";
      }
      // allTarget 规则（成本/人员）：所有带目标的指标当天都达标才绿，有一项红即红
      if (rule === "allTarget") {
        for (var i = 0; i < ms.length; i++) {
          var m = ms[i];
          for (var j = 0; j < dayRecs.length; j++) {
            var r = dayRecs[j];
            if (r.code === m.code && r.value !== null) { if (statusOf(m, r.value) === "r") return "r"; }
          }
        }
        return "g";
      }
      return "n";
    }
    // 收集某类别在指定日期下的全部指标及其各维度数据，供悬浮提示框使用
    // 返回结构：[{code,name,target,targetDir,dims:[{dim,value,unit}]}, ...]
    function catDayAllMetrics(cat, dateStr) {
      var dayRecs = DATA.daily.filter(function (r) { return r.date === dateStr; });
      var ms = DATA.metrics.filter(function (m) { return m.category === cat; });
      var byCode = {}, seen = {};
      ms.forEach(function (m) {
        var recs = dayRecs.filter(function (r) { return r.code === m.code; });
        if (recs.length === 0) return;
        if (!byCode[m.code]) byCode[m.code] = { name: m.name, code: m.code, target: m.target, targetDir: m.targetDir, dims: [] };
        recs.forEach(function (r) {
          var key = m.code + "|" + r.dim;
          if (seen[key]) return;
          seen[key] = true;
          byCode[m.code].dims.push({ dim: r.dim, value: r.value, unit: m.unit });
        });
      });
      return Object.values(byCode);
    }

    // 渲染顶部 4 张 KPI 卡片：取选中月份、按指标主维度计算月均值后展示
    function renderKPIs() {
      var box = document.getElementById("kpis"); box.innerHTML = "";
      var ym = curMonth();
      // mr：当前月份的全部日记录
      var mr = DATA.daily.filter(function (r) { return (r.year + "-" + pad2(r.month)) === ym; });
      // ga：对某一指标+维度，求当月所有有效记录的算术平均
      var ga = function (code, dim) { var xs = mr.filter(function (r) { return r.code === code && r.dim === dim && r.value !== null; }); if (!xs.length) return null; return xs.reduce(function (a, b) { return a + b.value; }, 0) / xs.length; };
      // 固定展示的 6 个核心指标（D01 出库准时率 / D03 入库准时率 / Q01 质量逃逸 / P03 技能合格率 / P02 出勤率 / C01 加班工时）；
      // 其中 P02 出勤率按自定义口径计算：实际出勤 ÷ 在岗编制 × 100%。
      // 注：本组由 .kpis{display:none} 整组隐藏，renderKPIs 仍会算值，逻辑保留以便日后复用。
      [
        { c: "D01", l: "出库准时率", u: "%", d: "实际值" },
        { c: "D03", l: "入库准时率", u: "%", d: "实际值" },

        { c: "C01", l: "加班工时", u: "h", d: "加班工时" }
      ].forEach(function (k) {
        var t, sub, val = null;
        if (k.d === "custom" && k.c === "P02") {
          var attend = ga("P02", "实际出勤");
          var hc = ga("P02", "在岗编制");
          t = (attend !== null && hc !== null && hc > 0) ? (attend/hc*100).toFixed(1)+"%" : "—";
          sub = attend !== null && hc !== null ? Math.round(attend)+"/"+Math.round(hc) : "";
          val = (attend !== null && hc !== null && hc > 0) ? attend/hc*100 : null;
        } else {
          var v = ga(k.c, k.d);
          t = v === null ? "—" : fmt(v, k.u);
          sub = "";
          val = v;
        }
        var m = DATA.metrics.find(function (x) { return x.code === k.c; });
        var abn = !!(m && val !== null && statusOf(m, val) === "r");
        box.innerHTML += '<div class="kpi' + (abn ? ' abn' : '') + '"><div class="v">' + t + '</div><div class="l">' + k.l + (sub ? ' <span style="color:#64748b">'+sub+'</span>' : "") + '</div></div>';
      });
    }

    // 渲染中部 5 个类别：字母形状日历，按 LETTER_DAY_MASKS[letter][dim] 查表取手工掩码
    // （源: SQDCP_字母掩码样例.md，含 28/29/30/31 四种天数），格内即日期编号，直接渲染无需降采样/路径计算
    function renderCats() {
      var box = document.getElementById("cats"); box.innerHTML = "";
      var ym = curMonth();
      if (!ym) { box.innerHTML = '<div style="color:#fff;padding:20px">无数据</div>'; return; }
      // 解析年月，dim 为当月天数
      var p = ym.split("-"); var Y = parseInt(p[0], 10), M = parseInt(p[1], 10);
      var dim = new Date(Y, M, 0).getDate();
      CATS.forEach(function (c) {
        var ms = DATA.metrics.filter(function (m) { return m.category === c.cat; });
        var tg = ms.filter(function (m) { return m.target !== null && m.target !== undefined; });
        // 类别标题栏（带字母、中文名、达标率占位）
        var h = '<div class="cat" style="--catc:' + c.color + '"><div class="cat-hdr" style="background:linear-gradient(135deg,' + c.color + ',' + c.color + 'cc)"><span class="lt">' + c.letter + '</span><span class="nm">' + c.cn + '</span><span class="pct" id="pct_' + c.cat + '"></span></div>';
        // 字母形状日历区 — 按 letter×dim 查表取手工掩码（源: SQDCP_字母掩码样例.md），格内即日期编号，直接渲染无需降采样/路径计算
        var grid = (LETTER_DAY_MASKS[c.letter] && LETTER_DAY_MASKS[c.letter][dim]) || LETTER_DAY_MASKS['S'][28];
        var rows = grid.length, cols = grid[0].length;
        var cellPx = 20;
        h += '<div class="cal"><div class="letter-grid" data-rows="' + rows + '" data-cols="' + cols + '" style="--cell:' + cellPx + 'px;grid-template-columns:repeat(' + cols + ',' + cellPx + 'px)">';
        // 按掩码行列原样渲染：>0 为该格日期，0 为字母外空位
        for (var ri = 0; ri < rows; ri++) {
          for (var ci = 0; ci < cols; ci++) {
            var dayNum = grid[ri][ci];
            if (dayNum > 0) {
              var ds = Y + "-" + pad2(M) + "-" + pad2(dayNum);
              var dr = DATA.daily.filter(function (r) { return r.date === ds; });
              var st = dr.length ? catDayStatus(c.cat, ds) : "n";

            } else {
              h += '<div class="cal-cell empty"></div>';
            }

        h += '</div></div>';
        // 底部信息：统计当月真实每天的达标情况（与字母点阵解耦，确保达标率准确）
        var g = 0, t = 0;
        for (var d = 1; d <= dim; d++) {
          var ds2 = Y + "-" + pad2(M) + "-" + pad2(d);
          var dr2 = DATA.daily.filter(function (r) { return r.date === ds2; });
          if (!dr2.length) continue;
          var s2 = catDayStatus(c.cat, ds2);

        }

        h += '<div class="ci"><div class="row"><div class="st-ph"></div><div class="owner"><span class="lb">\u8d23\u4efb\u4eba:</span>' + (c.owner || "—") + '</div><div class="st">\u672c\u6708\u8fbe\u6807 ' + g + "/" + t + '</div></div></div>';
        box.innerHTML += h;
        // 把达标率回填到标题栏右上角
        document.getElementById("pct_" + c.cat).textContent = t > 0 ? pct + "%" : "—";
      });
      // 底部布局自适应：收缩字母日历格子 + 达标文本缩放，保证单行完整不换行
      fitLetterGrids();
      fitStText();
    }
    // 根据实际可用空间收缩字母日历格子，避免 P 等长字形在窄/矮卡片里超出边框
    function fitLetterGrids() {
      document.querySelectorAll("#cats .letter-grid").forEach(function (grid) {
        var rows = parseInt(grid.getAttribute("data-rows"), 10) || 0;
        var cols = parseInt(grid.getAttribute("data-cols"), 10) || 0;
        var cal = grid.closest(".cal");
        if (!rows || !cols || !cal) return;
        var availW = Math.max(0, cal.clientWidth - 24);
        var availH = Math.max(0, cal.clientHeight - 20 - 6);
        var gap = 2;
        var cell = Math.floor(Math.min(
          (availW - (cols - 1) * gap) / cols,
          (availH - (rows - 1) * gap) / rows
        ));
        cell = Math.max(6, Math.min(24, cell));
        grid.style.setProperty("--cell", cell + "px");
        grid.style.gridTemplateColumns = "repeat(" + cols + "," + cell + "px)";
      });
    }
    // 本月达标文本超出容器时向右锚等比缩小，避免换行/溢出边框
    function fitStText() {
      document.querySelectorAll(".ci .row .st").forEach(function (st) {
        st.style.transform = "none";
        var parent = st.parentElement;
        var owner = parent.querySelector(".owner");
        var avail = parent.clientWidth - 26 - 8; // padding*2 + gap
        if (owner) avail -= owner.offsetWidth;
        var need = st.scrollWidth;
        if (avail > 0 && need > avail) {
          st.style.transform = "scale(" + (avail / need) + ")";
        }
      });
    }
    // 渲染左侧"本月指标对比"表格：每个指标按月均值对比目标，标注达标/未达标
    function renderCompare() {
      var tb = document.getElementById("cmpTable"); var ym = curMonth();
      var mr = DATA.daily.filter(function (r) { return (r.year + "-" + pad2(r.month)) === ym; });
      var rows = [];
      DATA.metrics.forEach(function (m) {
        var dim = mainDim(m.code);
        var xs = mr.filter(function (r) { return r.code === m.code && r.dim === dim && r.value !== null; });
        if (!xs.length) return;
        var s = 0; xs.forEach(function (r) { s += r.value; }); var a = s / xs.length;
        var st = statusOf(m, a); var cls = st === "g" ? "g" : (st === "r" ? "r" : "");
        var stT = st === "g" ? "达标" : (st === "r" ? "未达标" : "无目标");
        var trendHtml = "—";
        var p = ym.split("-"); var prevM = +p[1]-1; var prevY = +p[0]; if(prevM===0){prevM=12;prevY--}
        var prevYM = prevY+"-"+pad2(prevM); var prevMr = DATA.daily.filter(function(r){return(r.year+"-"+pad2(r.month))===prevYM});
        var prevXs = prevMr.filter(function(r){return r.code===m.code&&r.dim===dim&&r.value!==null});
        if(prevXs.length){var ps=0;prevXs.forEach(function(r){ps+=r.value});var pa=ps/prevXs.length;var diff=a-pa
          // 环比箭头：默认上升=绿、下降=红；目标方向「越低越好」的指标方向取反（升→红、降→绿）。
          var pCls=diff>0?"up":(diff<0?"down":"");var pDir=diff>0?"\u25b2":(diff<0?"\u25bc":"—")
          if(m.targetDir==="\u8d8a\u4f4e\u8d8a\u597d"){pCls=diff<0?"up":(diff>0?"down":"");pDir=diff<0?"\u25b2":(diff>0?"\u25bc":"—")}
          trendHtml='<span class="trend '+pCls+'">'+pDir+'</span>'}
        rows.push('<tr><td>'+m.name+'</td><td>'+dim+'</td><td>'+fmt(a,m.unit)+'</td><td>'+(m.target===null||m.target===undefined?"—":m.target)+'</td><td class="'+cls+'">'+stT+'</td><td>'+trendHtml+'</td></tr>');
      });
      tb.innerHTML = '<thead><tr><th>指标</th><th>维度</th><th>本月均值</th><th>目标</th><th>状态</th><th>环比</th></tr></thead><tbody>' + (rows.join("") || '<tr><td colspan="6" style="text-align:center;color:#aaa">本月无数据</td></tr>') + '</tbody>';
    }
    // 渲染右侧"红绿灯状态分布"饼图 + "未达标指标清单"
    var pieCanvasState = null;
    function renderPieAndFail() {
      var ym = curMonth(); var mr = DATA.daily.filter(function(r){return(r.year+"-"+pad2(r.month))===ym});
      var fails = [], p = ym.split("-"), Y = +p[0], M = +p[1], dimDays = new Date(Y, M, 0).getDate();
      // ① 收集未达标项：逐日逐指标按主维度求均值，statusOf 判红则记入 fails
      for(var d=1;d<=dimDays;d++){var ds=Y+"-"+pad2(M)+"-"+pad2(d);var dr=mr.filter(function(x){return x.date===ds});if(!dr.length)continue;
        DATA.metrics.forEach(function(m){if(m.target===null||m.target===undefined)return;var d2=mainDim(m.code);var xs=dr.filter(function(x){return x.code===m.code&&x.dim===d2&&x.value!==null});if(!xs.length)return;var s=0;xs.forEach(function(x){s+=x.value});var a=s/xs.length;if(statusOf(m,a)==="r")fails.push({date:ds,name:m.name,dim:d2,val:fmt(a,m.unit),tgt:m.target});});}
      // ② Canvas 初始化：按容器尺寸 × devicePixelRatio 建立高清画布并清空（dpr 缩放，避免模糊）
      var cv=document.getElementById("dimChart"),wrap=cv.parentElement;var w=wrap.clientWidth||240,h=wrap.clientHeight||160;var dpr=window.devicePixelRatio||1;
      cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+"px";cv.style.height=h+"px";var ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      // ③ 五维达标率：逐类别逐日判定“当天类别内带目标的指标是否全达标”，统计 good/total 算百分比
      var dims=[{l:"S",cn:"安全",c:"#6366f1",cat:"Safety"},{l:"Q",cn:"质量",c:"#34d399",cat:"Quality"},{l:"D",cn:"交付",c:"#38bdf8",cat:"Delivery"},{l:"C",cn:"成本",c:"#f59e0b",cat:"Cost"},{l:"P",cn:"人员",c:"#ec4899",cat:"People"}];
      dims.forEach(function(dd){var ms=DATA.metrics.filter(function(m){return m.category===dd.cat});var g=0,tot=0;
        for(var d=1;d<=dimDays;d++){var ds=Y+"-"+pad2(M)+"-"+pad2(d);var dr=mr.filter(function(x){return x.date===ds});if(!dr.length)continue;var allG=true,hasT=false;
          ms.forEach(function(m){if(m.target===null)return;hasT=true;var d2=mainDim(m.code);var found=dr.find(function(x){return x.code===m.code&&x.dim===d2});if(found&&statusOf(m,found.value)!=="g")allG=false});
          if(hasT){tot++;if(allG)g++}}dd.pct=tot?Math.round(g/tot*100):0;dd.good=g;dd.total=tot});
      // ④ 雷达图整体参数：圆心/半径/维数；BAD=70% 为低达标率阈值（红点警示）
      var cx=w/2,cy=h/2,rd=Math.min(cx-62,cy-46,74),nd=dims.length,BAD=70;
      // soft base glow behind radar — gives a "floating on water" depth on the light panel
      var baseG=ctx.createRadialGradient(cx,cy,0,cx,cy,rd*1.28);
      baseG.addColorStop(0,"rgba(56,189,248,.12)");
      baseG.addColorStop(.55,"rgba(139,92,246,.07)");
      baseG.addColorStop(1,"rgba(139,92,246,0)");
      ctx.fillStyle=baseG;ctx.beginPath();ctx.arc(cx,cy,rd*1.28,0,2*Math.PI);ctx.fill();
      // ⑤ 同心网格（0.25/0.5/0.75/1 四圈）+ 五条放射轴，浅灰描边，承载雷达读数
      [0.25,0.5,0.75,1].forEach(function(r){
        ctx.beginPath();for(var i=0;i<=nd;i++){var a=-Math.PI/2+(i%nd)*2*Math.PI/nd;var x=cx+rd*r*Math.cos(a);var y=cy+rd*r*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
        ctx.closePath();ctx.strokeStyle="rgba(100,116,139,.24)";ctx.lineWidth=0.8;ctx.stroke()});
      for(var i=0;i<nd;i++){var a=-Math.PI/2+i*2*Math.PI/nd;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+rd*Math.cos(a),cy+rd*Math.sin(a));ctx.strokeStyle="rgba(100,116,139,.15)";ctx.lineWidth=0.8;ctx.stroke()}
      // ⑥ 数据多边形：把各维达标率投影到对应放射轴，描边+淡填充+发光，整体外凸
      ctx.beginPath();dims.forEach(function(dd,i){var a=-Math.PI/2+i*2*Math.PI/nd;var r2=rd*(dd.pct/100);var x=cx+r2*Math.cos(a);var y=cy+r2*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
      ctx.closePath();
      ctx.fillStyle="rgba(99,102,241,.07)";ctx.fill();
      ctx.strokeStyle="rgba(79,70,229,.9)";ctx.lineWidth=2.8;ctx.lineJoin="round";ctx.shadowColor="rgba(99,102,241,.45)";ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;
      // vertices + leader lines + external labels (text kept outside the pentagon)
      dims.forEach(function(dd,i){var a=-Math.PI/2+i*2*Math.PI/nd;var r2=rd*(dd.pct/100);
        var vx=cx+r2*Math.cos(a),vy=cy+r2*Math.sin(a);
        var gx=cx+rd*Math.cos(a),gy=cy+rd*Math.sin(a);
        var lx=cx+(rd+20)*Math.cos(a),ly=cy+(rd+20)*Math.sin(a);
        var bad=dd.pct<BAD;
        // ⑦ 引导线：浅灰虚线，把每个顶点连到画布外侧文字标签
        ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(lx,ly);ctx.strokeStyle="rgba(148,163,184,.45)";ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
        // ⑧ 顶点节点：带光晕的彩色圆点（正常用维度色，低达标率<BAD 则用红色警示+外圈环+中心白点）
        ctx.beginPath();ctx.arc(vx,vy,bad?6:5.5,0,2*Math.PI);ctx.fillStyle=bad?"#ef4444":dd.c;ctx.shadowColor=bad?"#ef4444":dd.c;ctx.shadowBlur=bad?22:14;ctx.fill();ctx.shadowBlur=0;
        ctx.beginPath();ctx.arc(vx,vy,bad?6:5.5,0,2*Math.PI);ctx.strokeStyle=bad?"rgba(239,68,68,.35)":dd.c+"55";ctx.lineWidth=4;ctx.stroke();
        ctx.beginPath();ctx.arc(vx,vy,2.4,0,2*Math.PI);ctx.fillStyle="#fff";ctx.fill();
        if(bad){ctx.beginPath();ctx.arc(vx,vy,11,0,2*Math.PI);ctx.strokeStyle="rgba(239,68,68,.85)";ctx.lineWidth=1.5;ctx.stroke()}
        // ⑨ 外标签：维度字母+达标率在上、中文名在下；按顶点方位自动选左/右/居中对齐
        var align=Math.abs(Math.cos(a))<0.3?"center":(Math.cos(a)>0?"left":"right");
        var tx=align==="center"?lx:(align==="left"?lx+4:lx-4);
        ctx.textAlign=align;ctx.textBaseline="middle";
        ctx.fillStyle=bad?"#f87171":dd.c;ctx.font="bold 12px sans-serif";ctx.fillText(dd.l+" "+dd.pct+"%",tx,ly);
        ctx.fillStyle=bad?"rgba(248,113,113,.9)":"rgba(226,232,240,.82)";ctx.font="10px sans-serif";ctx.fillText(dd.cn,tx,ly+14);
      });
      ctx.fillStyle="rgba(255,255,255,.1)";ctx.font="8px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("SQDCP",cx,cy);
      // ⑩ 图例：legend 当前由 .chart-legend{display:none} 隐藏，HTML 仍生成以便日后复用
      var lhtml="";dims.forEach(function(dd){lhtml+='<div class="lg-row"><span class="dot" style="background:'+dd.c+'"></span><span style="color:#94a3b8">'+dd.l+'</span><span class="lg-pct">'+dd.pct+'%</span></div>'});document.getElementById("chartLegend").innerHTML=lhtml;
      // ⑪ 未达标清单：按日期升序渲染卡片；无未达标项则显示全部达标的祝贺提示
      var box=document.getElementById("failList");if(!fails.length){box.innerHTML='<div class="empty">\uD83C\uDF89 \u672C\u6708\u6240\u6709\u76EE\u6807\u6307\u6807\u5168\u90E8\u8FBE\u6807</div>';return}
      fails.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});box.innerHTML=fails.map(function(f){return '<div class="fail-item"><div class="fi-h"><span class="date">'+fmtDate(f.date)+'</span></div><div class="fi-b"><span class="nm">'+f.name+' / '+f.dim+'</span><span class="vals"><span class="act">'+f.val+'</span> / <span class="tgt">\u76EE\u6807 '+f.tgt+'</span></span></div></div>'}).join("");
    }function renderOverallRate() {
      var ym = curMonth();
      var mr = DATA.daily.filter(function (r) { return (r.year + "-" + pad2(r.month)) === ym; });
      var g = 0, t = 0;
